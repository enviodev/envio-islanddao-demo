"""
Where a registration stands, as the program stores it. An event without an
approval step confirms every registration straight away.
"""
enum RegistrationStatus {
  "Waiting for an organizer to approve it."
  Pending
  "Accepted: approved by an organizer, or automatically when the event has no approval step."
  Confirmed
  Rejected
  Cancelled
}

"Program-wide totals, a single row keyed by chain name, for dashboard KPIs."
type GlobalStats {
  id: ID!
  organizations: Int!
  events: Int!
  sessions: Int!
  users: Int!
  profiles: Int!
  registrations: Int!
  checkIns: Int!
  passesSold: Int!
  "USDC base units (6 decimals)."
  passRevenue: BigInt!
  lastActivityAt: Int!
}

type Organization {
  id: ID!
  handle: String!
  name: String!
  description: String!
  imageUrl: String!
  website: String!
  admin: String!
  createdAt: Int!
  events: [Event!]! @derivedFrom(field: "organization")
}

"A top-level event (IslandDAO V4, V5) or one of its sessions: talks, demos, socials."
type Event {
  id: ID!
  organization: Organization!
  "Set once the event is attached to a parent as a session."
  parent: Event
  sessions: [Event!]! @derivedFrom(field: "parent")
  name: String! @index
  description: String!
  imageUrl: String!
  link: String!
  location: String!
  venue: String!
  latitude: Float
  longitude: Float
  category: Int!
  categoryLabel: String!
  "The program's status byte: 2 scheduled, 3 completed, 4 cancelled."
  status: Int!
  statusLabel: String!
  startTime: Int! @index
  endTime: Int!
  "The event's UTC offset, in minutes. Day boundaries and local dates use it. The few sessions created without one take their main event's."
  utcOffsetMinutes: Int!
  "Registrations wait for an organizer's approval (V5) instead of being confirmed on the spot (V4)."
  requiresApproval: Boolean!
  "Edits made after creation: details, times, status or image."
  editCount: Int!
  updatedAt: Int
  creator: String!
  createdAt: Int!
  createdTx: String!
  sessionCount: Int!
  "Distinct registrations ever opened, whatever their current status."
  registrationCount: Int!
  pendingCount: Int!
  confirmedCount: Int!
  rejectedCount: Int!
  cancelledCount: Int!
  checkInCount: Int!
  "Attendees with at least one daily check-in, the same as the program's attendance accounts."
  uniqueAttendeeCount: Int!
  lastCheckInAt: Int
  registrations: [Registration!]! @derivedFrom(field: "event")
  checkIns: [CheckIn!]! @derivedFrom(field: "event")
  days: [EventDay!]! @derivedFrom(field: "event")
}

type User {
  id: ID!
  displayName: String
  bio: String
  avatarUrl: String
  website: String
  "X (Twitter) handle attested by the program's verifier."
  xHandle: String
  profile: String
  firstSeenAt: Int!
  registrationCount: Int!
  checkInCount: Int!
  passCount: Int!
  "USDC base units (6 decimals) spent on passes."
  passSpend: BigInt!
  registrations: [Registration!]! @derivedFrom(field: "user")
  checkIns: [CheckIn!]! @derivedFrom(field: "user")
  passes: [PassPurchase!]! @derivedFrom(field: "buyer")
}

"Keyed by the registration PDA, which is reused when an attendee re-registers."
type Registration {
  id: ID!
  event: Event!
  user: User!
  status: RegistrationStatus!
  registeredAt: Int!
  registeredTx: String!
  "Order of sign-up for the event: 1 for the first registration. Kept when the attendee re-registers."
  registrationNumber: Int!
  reviewedAt: Int
  reviewedBy: String
  cancelledAt: Int
  "The one-off event check-in (instruction 0x05), separate from the daily check-ins."
  arrivedAt: Int
  timesRegistered: Int!
  checkInCount: Int!
  firstCheckInAt: Int
  lastCheckInAt: Int
  checkIns: [CheckIn!]! @derivedFrom(field: "registration")
}

type CheckIn {
  id: ID!
  event: Event! @index
  user: User! @index
  registration: Registration!
  "The attendance account that counts this attendee's days at the event."
  attendance: String!
  checkInAuthority: String!
  timestamp: Int! @index
  "Day of the event as the program counts it: whole days since the start, plus one. Early check-ins count as day 1."
  eventDay: Int!
  "The local calendar date of that event day, YYYY-MM-DD."
  day: String!
  "1 for the attendee's first check-in at this event, 2 for the second day, ..."
  dayNumber: Int!
  slot: Int!
  txSignature: String!
}

type EventDay {
  id: ID!
  event: Event!
  "Day of the event, 1-based, as the program counts it."
  eventDay: Int!
  "Local calendar date, YYYY-MM-DD."
  day: String! @index
  checkIns: Int!
  "Attendees whose first check-in at the event was this day."
  firstTimers: Int!
  "The first islander to check in that day."
  firstIn: User!
}

type TicketTier {
  id: ID!
  event: Event!
  name: String!
  dates: String!
  "USDC base units (6 decimals)."
  price: BigInt!
  maxSupply: BigInt
  sold: Int!
}

type PassPurchase {
  id: ID!
  tier: TicketTier!
  event: Event!
  buyer: User!
  asset: String!
  price: BigInt!
  timestamp: Int!
  txSignature: String!
}
